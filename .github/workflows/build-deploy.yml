name: Build Windows EXE and publish Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install native compilation tools for .NET AOT
        shell: pwsh
        run: |
          # Hosted windows-2022 images provide Visual Studio Build Tools and the MSVC toolchain.
          Write-Host 'Using installed Visual Studio C++ native toolchain'
      - name: Install pinned public Pocket TTS ONNX inference code
        shell: pwsh
        run: |
          $revision = '58a6d00cf13d239b6748cb0769f35c580a8f606c'
          $url = "https://huggingface.co/KevinAHM/pocket-tts-onnx/resolve/$revision/pocket_tts_onnx.py"
          Invoke-WebRequest -Uri $url -OutFile desktop/engine/pocket_tts_onnx.py
          python -m py_compile desktop/engine/pocket_tts_onnx.py
      - name: Prepare Pocket TTS clipboard reader
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/engine/requirements.txt
          pyinstaller --clean --noconfirm --onedir --windowed --name reader `
            --collect-all onnxruntime --collect-all sentencepiece --collect-all safetensors `
            --collect-all huggingface_hub --collect-all sounddevice --collect-all _sounddevice_data `
            --collect-all soundfile --hidden-import pocket_tts_onnx `
            desktop/engine/reader.py
          if (-not (Test-Path dist/reader/reader.exe)) { throw 'Reader build failed' }
      - name: Verify frozen windowed reader handles Hugging Face without a console
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = (Resolve-Path 'dist/reader/reader.exe').Path
          $p = Start-Process -FilePath $binary -ArgumentList '--self-test-headless' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windowed reader failed its no-console progress test (exit $($p.ExitCode))" }
          Write-Host 'PASS: Frozen --windowed Python reader handles Hugging Face tqdm without stdout/stderr.'
      - name: Build native Windows launcher
        shell: pwsh
        run: |
          dotnet publish desktop/launcher/ClipboardVoiceLauncher.csproj `
            -c Release -r win-x64 -p:PublishAot=true -o launcher-out
          if (-not (Test-Path launcher-out/ClipboardVoiceLauncher.exe)) { throw 'Launcher build failed' }
      - name: Make downloadable base EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web/download | Out-Null
          Compress-Archive -Path dist/reader/* -DestinationPath runtime.zip -CompressionLevel Optimal
          python tools/append_bundle.py launcher-out/ClipboardVoiceLauncher.exe runtime.zip web/download/ClipboardReader-Base.exe
          $binary = 'web/download/ClipboardReader-Base.exe'
          $metadata = @{
            sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            size = (Get-Item $binary).Length
            revision = $env:GITHUB_SHA.Substring(0, 10)
            architecture = 'windows-x64'
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'web/download/build-info.json'), $metadata, (New-Object System.Text.UTF8Encoding($false)))
      - name: Smoke-test actual Windows EXE loader and embedded voice overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = (Resolve-Path 'web/download/ClipboardReader-Base.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($base)
          if ([System.Text.Encoding]::ASCII.GetString($bytes,0,2) -ne 'MZ') { throw 'EXE lacks MZ signature' }
          $pe = [BitConverter]::ToInt32($bytes,0x3c)
          if ([System.Text.Encoding]::ASCII.GetString($bytes,$pe,4) -ne "PE`0`0") { throw 'Invalid PE header' }
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw 'EXE is not Windows x64' }
          if ([System.Text.Encoding]::ASCII.GetString($bytes,$bytes.Length-16,8) -ne 'CVRZIP01') { throw 'Missing reader ZIP trailer' }
          # Confirm the Windows OS can actually execute the launcher, not just inspect it.
          $p = Start-Process -FilePath $base -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Base EXE failed to run (exit code $($p.ExitCode))" }
          $personalized = Join-Path (Get-Location) 'ClipboardVoice-smoke.exe'
          Copy-Item $base $personalized
          $profileJson = '{"engine":"pocket","voice_wav_b64":"' + ('A' * 1500000) + '"}'
          $payload = [System.Text.Encoding]::UTF8.GetBytes($profileJson)
          $out = [System.IO.File]::Open($personalized,[System.IO.FileMode]::Append)
          try {
            $out.Write($payload,0,$payload.Length)
            $footer = [System.Text.Encoding]::ASCII.GetBytes('CVRCFG01')
            $out.Write($footer,0,$footer.Length)
            $sizeBytes = [BitConverter]::GetBytes([long]$payload.Length)
            $out.Write($sizeBytes,0,$sizeBytes.Length)
          } finally { $out.Dispose() }
          $p = Start-Process -FilePath $personalized -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Personalized EXE failed to run (exit code $($p.ExitCode))" }
          Write-Host 'PASS: Base and personalized Windows PE programs both launch successfully.'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-base-exe
          path: web/download/
          retention-days: 14
          compression-level: 0
  deploy:
    needs: windows
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-base-exe
          path: web/download
      - name: Include browser-only Pocket TTS cloning studio
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/pocket-voice-src
          git -C /tmp/pocket-voice-src remote add origin https://github.com/hemanth/pocket-voice.git
          git -C /tmp/pocket-voice-src fetch --depth 1 origin a4496c429f1dcd6ea8faef55a21dc4b7d45636a9
          git -C /tmp/pocket-voice-src checkout --detach FETCH_HEAD
          mkdir -p web/pocket
          for f in index.html app.js inference-worker.js main-thread-worker-shim.js PCMPlayerWorklet.js EventEmitter.js sentencepiece.js style.css favicon.svg; do
            cp "/tmp/pocket-voice-src/$f" "web/pocket/$f"
          done
          cp web/pocket-theme.css web/pocket/pocket-theme.css
          cp web/pocket-export.js web/pocket/pocket-export.js
          printf '%s\\n' 'Website adaptation and Windows exporter: tbenitz (https://github.com/tbenitz)' 'Original browser studio: Hemanth HM, Pocket Voice (MIT): https://github.com/hemanth/pocket-voice' 'Pocket TTS models: Kyutai: https://github.com/kyutai-labs/pocket-tts' 'ONNX port: KevinAHM: https://huggingface.co/spaces/KevinAHM/pocket-tts-web' > web/pocket/ATTRIBUTION.txt
          python tools/customize_pocket.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
