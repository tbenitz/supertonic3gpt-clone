name: Build Windows EXE and publish Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install native compilation tools for .NET AOT
        shell: pwsh
        run: |
          # Hosted windows-2022 images provide Visual Studio Build Tools and the MSVC toolchain.
          Write-Host 'Using installed Visual Studio C++ native toolchain'
      - name: Prepare Python Supertonic reader
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/engine/requirements.txt
          pyinstaller --clean --noconfirm --onedir --windowed --name reader `
            --collect-all supertonic --collect-all onnxruntime `
            --collect-all sounddevice --collect-all _sounddevice_data `
            desktop/engine/reader.py
          if (-not (Test-Path dist/reader/reader.exe)) { throw 'Reader build failed' }
      - name: Add official Pocket TTS CPU runtime for Windows x64
        shell: pwsh
        run: |
          $url = 'https://github.com/kyutai-labs/pocket-tts/releases/download/v4.0.1/pocket-tts-3.3.0-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $url -OutFile pocket-cli.zip
          Expand-Archive -Path pocket-cli.zip -DestinationPath pocket-unpacked -Force
          $binary = Get-ChildItem -Path pocket-unpacked -Recurse -Filter pocket-tts.exe | Select-Object -First 1
          if (-not $binary) { throw 'Official Pocket TTS Windows binary not found' }
          New-Item -ItemType Directory -Force -Path dist/reader/pocket_engine | Out-Null
          Copy-Item -Path (Join-Path $binary.Directory.FullName '*') -Destination dist/reader/pocket_engine -Recurse -Force
          if (-not (Test-Path dist/reader/pocket_engine/pocket-tts.exe)) { throw 'Pocket TTS copy failed' }
      - name: Build native Windows launcher
        shell: pwsh
        run: |
          dotnet publish desktop/launcher/ClipboardVoiceLauncher.csproj `
            -c Release -r win-x64 -p:PublishAot=true -o launcher-out
          if (-not (Test-Path launcher-out/ClipboardVoiceLauncher.exe)) { throw 'Launcher build failed' }
      - name: Make downloadable base EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web/download | Out-Null
          Compress-Archive -Path dist/reader/* -DestinationPath runtime.zip -CompressionLevel Optimal
          python tools/append_bundle.py launcher-out/ClipboardVoiceLauncher.exe runtime.zip web/download/ClipboardReader-Base.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-base-exe
          path: web/download/ClipboardReader-Base.exe
          retention-days: 14
          compression-level: 0
  deploy:
    needs: windows
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-base-exe
          path: web/download
      - name: Include browser-only Pocket TTS cloning studio
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/pocket-voice-src
          git -C /tmp/pocket-voice-src remote add origin https://github.com/hemanth/pocket-voice.git
          git -C /tmp/pocket-voice-src fetch --depth 1 origin a4496c429f1dcd6ea8faef55a21dc4b7d45636a9
          git -C /tmp/pocket-voice-src checkout --detach FETCH_HEAD
          mkdir -p web/pocket
          for f in index.html app.js inference-worker.js main-thread-worker-shim.js PCMPlayerWorklet.js EventEmitter.js sentencepiece.js style.css favicon.svg; do
            cp "/tmp/pocket-voice-src/$f" "web/pocket/$f"
          done
          sed -i 's|/ai/pocket-voice/favicon.svg|./favicon.svg|g;s|/ai/pocket-voice/og-image.png|./favicon.svg|g' web/pocket/index.html
          printf '%s\n' 'Pocket Voice browser studio: MIT © Hemanth HM (https://github.com/hemanth/pocket-voice)' 'ONNX weights: Kyutai / KevinAHM. Model license applies.' > web/pocket/ATTRIBUTION.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
