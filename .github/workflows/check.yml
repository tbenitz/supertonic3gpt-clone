name: Static and format checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q desktop/engine backend tools
      - name: Check browser studio JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/index.html').read_text(encoding='utf-8')
          scripts = [html.rsplit('<script>', 1)[1].split('</script>', 1)[0]] if '<script>' in html else []
          assert scripts, 'Missing website script'
          Path('/tmp/studio.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/studio.js
